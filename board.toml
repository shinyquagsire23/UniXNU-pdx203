schema_version = 2

# board description of the sony xperia 1 ii (pdx203, sm8250 "kona"), read by the unixnu build driver (format 2: the
# shared SM8250 SoC repository, the iPadOS 17.7.11 21H461 OS profile and the catalog's component recipes). values
# marked verified were observed on the phone by the ios-sweet port or this one; docs/bring-up.md keeps the list.

[board]
name = "pdx203"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Sony Xperia 1 II"
kit = "pdx203"                     # package/ of this repository appears as kits/pdx203 in the build tree

[components]
# The minimal image: storage (the device's own ShengUfs, the pdx203 bring-up transport), the Data RAM disk, the GOP
# framebuffer with touch through ShengHidInput, the keystore stand-in. ShengHidInput's recipe is not run on its own:
# scripts/build-pdx203-legacy-display.py builds it and puts its late object in the force-loaded display archive.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "ShengUfs", "RamBlock", "GopFramebuffer", "ShengHidInput",
           "AppleKeyStoreState", "XnuPrelink", "DarwinBoot", "QcomXnuUsbDebug"]

# the donor image, the same one the OS profile names: the unchanged iPad7,1 iPadOS 17.7.11 restore image, the identity
# sheng and alioth use (no pac on the a77, so the arm64 ipad userland, not an arm64e iphone one). --ipsw PATH uses a local
# file. chip_id/board_id are Apple's j120ap ApChipID/ApBoardID, not the Qualcomm SoC id of [payload.adt].
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 0x0C
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# the raw image for the userdata partition (lun 0, 4096-byte lbas, 91 gpt entries, disk last lba 0x3b947ff).
# first_lba is the "userdata" gpt entry as the ufs driver printed it on the phone, last_lba follows from the same boot log
# (the persistent log sits in the last 1025 blocks, at 0x3b92ffa). the OS and SystemOS windows are already written.
[userdata]
first_lba = 0x3cd75b
last_lba = 0x3b933fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "pdx203_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
# device:patches/xnu/pre-os.series supplies the original PMGR publication patch the OS series builds on (see there)
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/pre-os.series", "os:patches/xnu/series",
                "device:patches/xnu/series"]
# the catalog recipes of [components] run first; this dispatcher then runs the board's builders for what the defconfig
# links (bindings to original classes, platform power, the GOP display with the input probes, the USB log).
archives = [
  "build-pdx203-archives.py",
]

[device_tree]
source = "device:dts/pdx203.dts"
include_dirs = ["soc:dts"]

# the mu-silicium port, chardidathing/uefi-pdx203 branch pdx203 (--uefi DIR), its docs/pdx203.md has the port notes.
# the block is the one that port hands over (unixnu/ref/firmware-pdx203.toml). the preflight runs from the build tree,
# scripts/check-pdx203.py is its copy and wants UNIXNU_UEFI=<uefi checkout>.
[firmware]
config = "pdx203"                  # Resources/Configs/pdx203.toml in the uefi checkout
dsc = "Platforms/Sony/pdx203Pkg/pdx203.dsc"
fd = "Build/pdx203Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-pdx203.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Sony",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"            # keeps unsigned payload drivers loadable during bring-up, the mu default
DEVICE_MODEL = "pdx203"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "pdx203-research"

# the bootloader has only been seen to boot the stock header v2 layout (page 4096, kernel 0x8000, ramdisk 0x2000000, tags
# 0x1e00000, dtb 0x1f00000, the kona dtb set in the dtb section, flashed to boot_a, no fastboot boot). "unixnu bootimg"
# appends the dtb to the gzip stream and cannot write a dtb section, so the flashable image comes from the uefi checkout:
#   python3 <uefi>/scripts/pack-pdx203-bootimg.py --fd <fd> --ramdisk out/pdx203/payload/payload.img -o out/pdx203/boot/boot.img
# this override keeps the driver's own packing a valid v1 container should it be wanted anyway.
[bootimg.image]
header_version = 1

# the ramdisk of the boot image: a fat volume with the unixnu config, the kernel, its device tree and the
# optional trust cache and data seed. darwinboot is part of the firmware volume.
[payload]
volume = "PDX203ESP"
# boot_a is 0x6000000 (96 mib, fastboot getvar partition-size:boot_a). the header page, the fd section (at most the 3 mib
# fd plus its shim) and the kona dtb section (~1.5 mib) leave a little over 91 mib for the ramdisk.
size_mib = 91
loader = "firmware"
title = "pdx203"
dram_size = "0xfcc00000"           # the upper ddr bank, as dts/pdx203.dts declares it
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true                # the panic text stays on the panel, there is no uart on this phone
# the minimal set of the format 1 image. each argument returns with the feature that needs it.
kernel_args = [
  "-v",
  # amfi panics "No PMGR?" without the published original ApplePMGRNub (CONFIG_XNU_SHENG_PMGR)
  "sheng-pmgr=2",
  "serial=3",
  "debug=0x14e",
  "-enable_kprintf_spam",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  # watchdogd's _PanicOnCrash: kern_exit.c's panic_on_crash_disabled stops proc_should_trigger_panic() first
  "panic_on_crash_disabled=1",
  # all eight cores through psci (dts/pdx203.dts), as ios-sweet ran this phone
  "sheng-smp=1",
  # IPIs as software-pended SPIs: ICC_SGI1R_EL1 generates nothing on this SoC (alioth's pair for the same SoC)
  "armcpu-spi-ipi=1",
  "armcpu-self-ipi=1",
  # storage: the OS window of userdata as root, without the signed owner-root policy (CONFIG_XNU_BRINGUP_OWNER_CACHE)
  "native-ufs-root=1",
  "native-ufs-allow-unverified=1",
  # the GOP display: the board probe starts NativeLegacyDisplay on the darwinboot framebuffer once IOSurface is up
  # (phase 4, as a /arm-io display-subsystem child) with cpu presentation
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "sheng-vsync=60",
  "ml-timeout-lock-panic-scale=40",
  # the CDC-ACM kernel log (drivers/QcomXnuUsbDebug, CONFIG_XNU_QCOM_USB_DEBUG), 1209:316d; qcom-usb-ctl=1 adds the
  # control channel (status, reboot)
  "qcom-usb-debug=1",
  "qcom-usb-ctl=1",
  # sheng's launchd policy (package/BootWatchdogPolicy.c via patches/xnu/zzzzzzzzza-launch-policy.patch)
  "sheng-disable-watchdogd=1",
  "sheng-lite=1",
  "sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined",
  # touch: the HID start-up, the ten-finger digitizer and the sec_ts probe (GENI I2C 0x48 on SE13)
  "offline-hid-input=1",
  "sheng-touch-hid=1",
  "pdx203-touch=1",
  # the power and volume buttons over SPMI (package/ButtonProbe.cpp)
  "pdx203-bt=3",
  # the AppleKeyStore stand-in: "no passcode, nothing locked"
  "offline-key-events=1",
  "sheng-aks=1",
  # RAM asked for as Device memory is mapped Normal non-cacheable (patches/xnu/zzzzzzzzzc-pmap-ram-wc.patch): the
  # software renderer clears display surfaces with DC ZVA, which alignment-faults on Device memory
  "pmap-ram-wc=1",
  # persistent Data in the store window at the end of userdata: 2 reads and writes. the 64 GiB seed is served from it
  "sheng-data-persist=2",
]
# Fixups of signed text beyond the OS profile's four (its [payload] text_fixups is replaced, so they are repeated here).
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
  # CoreImage _CIGLIsUsable answers false: without a Metal device CIContext otherwise falls back to an OpenGL ES context
  # whose dispatch table is all zero, and SpringBoard died at pc 0 (2026-11-01)
  "dyld_shared_cache_arm64.07,2d00df8,fd7bbfa9fd030091,00008052c0035fd6",
  # CoreMotion: the orientation event's own timestamp reaches notifyAOO (2026-11-02)
  "dyld_shared_cache_arm64.05,6749788,f6ddf297,f60300aa",
  # QuartzCore CADeviceUseVBL: use_vbl is always set, so the render server asks the framebuffer for vsync (2026-11-03)
  "dyld_shared_cache_arm64.03,27d6634,a00000b4,03000014",
]

[payload.adt]
# Data keeps its writes (sheng-data-persist=2): no /chosen/ephemeral-storage, so datamigrator and keybagd treat it as real storage
persistent_data = true
# /chosen/chip-id, read as hex (0x207) as the format 1 ADT script read it: with unique-chip-id it seeds IOPlatformUUID, so the
# value stays what this phone has booted with
chip_id = "207"
# 3 GiB window in the upper bank (uefi-pdx203's Pdx203BootMemoryDxe adds it)
owned_memory_size = "0xc0000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of the 21H461 iPad7,1 image
packed_data_ramdisk = true
unique_chip_id = "required"        # the platform seed is not stored in any repository

# mount(8) phase 1 names /private/preboot/<hash> after this; launchd's mount[3] exited with status 66 without it
# (2026-11-01). no apple personalization manifest exists here, so it is an explicit bring-up boot-set identity in uke's
# form: SHA-384 of "Pdx203Bringup.BootSet.v1\0", not apple data.
[adt.chosen.bytes]
boot-manifest-hash = "1d0d00ef77a4c50547b2d7fbfd56aeeb40c17eda7e79c8ca5154b8c334ec3699b0dfaae2fd1cae411831855ab1451d6b"

# no suspend on this board, so the cpu never parks
[adt.defaults.u32]
sleep-disabled = 1

[adt.product.string]
model = "sony,pdx203"
# sRGB, as sheng declares it for the 8-bit framebuffer: with P3 the render server draws a 10-bit 'b3a8' deep framebuffer
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

# home-button-type 2 is the gesture-only case: the lock screen offers the swipe-to-unlock gesture
[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2
