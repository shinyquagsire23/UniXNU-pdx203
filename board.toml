# board description of the sony xperia 1 ii (pdx203, sm8250 "kona"), read by the unixnu build driver.
# values marked verified were observed on the phone by the ios-sweet port, the rest come from the stock
# kona dtb and sony's kernel source. docs/bring-up.md keeps the list.

[board]
name = "pdx203"
soc = "SM8250"
description = "Sony Xperia 1 II"
kit = "pdx203"                     # package/ of this repository appears as kits/pdx203 in the build tree

# the target os image: the unchanged iPad7,1 iPadOS 17.7.11 restore image, the same identity sheng and uke
# use (no pac on the a77, so the arm64 ipad userland, not an arm64e iphone one). --ipsw PATH uses a local file.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# the raw image for the userdata partition (lun 0, 4096-byte lbas, 91 gpt entries, disk last lba 0x3b947ff).
# first_lba is the "userdata" gpt entry as the ios-sweet ufs driver printed it on the phone, last_lba follows
# from the same boot log (the persistent log sits in the last 1025 blocks, at 0x3b92ffa), so both are from
# the phone, not from a gpt dump. 228444 MiB, ~223 GiB, plenty for the two windows.
[userdata]
first_lba = 0x3cd75b
last_lba = 0x3b933fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "pdx203_defconfig"
# one dispatcher instead of a fixed list, it reads the XNU_* flags of the selected defconfig from its
# environment and runs only the builders that configuration links (scripts/build-pdx203-archives.py).
# it runs when the defconfig sets CONFIG_XNU_BUILD_ARCHIVES, after the bootstrap pass left the compile records.
archives = [
  "build-pdx203-archives.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
# same component set as sheng: the pmgr integration and the aes bindings are qualified against these addresses
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# the mu-silicium port, chardidathing/uefi-pdx203 branch pdx203 (--uefi DIR), its docs/pdx203.md has the port notes.
# the block is the one that port hands over (unixnu/ref/firmware-pdx203.toml). the preflight runs from the build tree,
# scripts/check-pdx203.py is its copy and wants UNIXNU_UEFI=<uefi checkout>.
[firmware]
config = "pdx203"                  # Resources/Configs/pdx203.toml in the uefi checkout
dsc = "Platforms/Sony/pdx203Pkg/pdx203.dsc"
fd = "Build/pdx203Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-pdx203.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Sony",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "0"            # keeps unsigned payload drivers loadable during bring-up, the mu default
DEVICE_MODEL = "pdx203"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "pdx203-research"

# the bootloader has only been seen to boot the stock header v2 layout (page 4096, kernel 0x8000, ramdisk 0x2000000, tags
# 0x1e00000, dtb 0x1f00000, the kona dtb set in the dtb section, flashed to boot_a, no fastboot boot). "unixnu bootimg"
# appends the dtb to the gzip stream and cannot write a dtb section, so the flashable image comes from the uefi checkout:
#   python3 <uefi>/scripts/pack-pdx203-bootimg.py --fd <fd> --ramdisk out/pdx203/payload/payload.img -o out/pdx203/boot/boot.img
# this override keeps the driver's own packing a valid v1 container should it be wanted anyway.
[bootimg.image]
header_version = 1

# the ramdisk of the boot image: a fat volume with the unixnu config, the kernel, its device tree and the
# optional trust cache and data seed. darwinboot is part of the firmware volume.
[payload]
volume = "PDX203ESP"
# boot_a is 0x6000000 (96 mib, fastboot getvar partition-size:boot_a). the header page, the fd section (at most the 3 mib
# fd plus its shim) and the kona dtb section (~1.5 mib) leave a little over 91 mib for the ramdisk. the first-console
# kernel and its adt take ~50 mib. the loader ends the ramdisk at 0xb0000000, inside the 256 mib "Kernel" region
size_mib = 88
loader = "firmware"
title = "pdx203 first boot: source 4K XNU to console"
dram_size = "0xfcc00000"           # the upper ddr bank, 0x1_00000000 + 0xfcc00000, verified as xnu's ram by ios-sweet
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true                # the panic text stays on the panel, there is no uart on this phone
# the original static/System trust caches of the ipsw and the owner bundle built around them, as sheng accepts them
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# the first-console set. stage 6 adds native-ufs-root=1 with --kernel-arg (docs/bring-up.md), it needs the
# pdx203-full kernel and the payload step refuses it on the first-console one.
kernel_args = [
  "-v",
  # amfi panics "No PMGR?" without the published original ApplePMGRNub (CONFIG_XNU_SHENG_PMGR)
  "sheng-pmgr=2",
  # -uketextconsole (the uke video console patch of the fork: kprintf on the panel through the text console) is off since
  # the lock screen (2026-11-01): the log drew over the ui, and the qcom-usb-debug log below carries all of it. put it back
  # for a boot that has to be read off the panel (a usb log that does not come up)
  "serial=3",
  "debug=0x14e",
  # development kernels keep kprintf quiet unless this is set, and with no uart the framebuffer console
  # is the only place the early log goes
  "-enable_kprintf_spam",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "-no_slto_panic",
  # watchdogd hits a BRK (exit namespace 2 subcode 0x5) and its plist sets _PanicOnCrash, so one crash panicked the
  # kernel (2026-11-01, as on UniXNU-alioth: watchdogd wants a Data volume in the root volume group and the seed's
  # volume has no role). kern_exit.c's panic_on_crash_disabled tunable stops proc_should_trigger_panic() before that
  # branch. the bring-up answer: it suppresses every job's crash panic, launchd included
  "panic_on_crash_disabled=1",
  # all eight cores through psci (cpu_regs below), as ios-sweet ran this phone. verified 2026-11-01: boots and settles
  # into the same userland once NativeRamBlock waits for the Data volume media (the race smp exposed)
  "sheng-smp=1",
  # IPIs: ArmCpu records that ICC_SGI1R_EL1 generates nothing on this SoC, so an SGI never reaches another core.
  # armcpu-spi-ipi=1 sends IPIs as software-pended SPIs (1008 + core) routed to that core, and armcpu-self-ipi=1 has every
  # core take one at start (XNU enables a core's IPI only after it took one); alioth's pair for the same SoC. without them a
  # stackshot's cross-call never held the other cores and the kernel panicked in stackshot_thread_turnstileinfo
  # (2026-11-01, persistent Data boot)
  "armcpu-spi-ipi=1",
  "armcpu-self-ipi=1",
  # the GOP display of pdx203-userland_defconfig (scripts/build-pdx203-legacy-display.py), sheng's set of 2026-10-22 without
  # its hid, key event and gpu keys: bsd_init registers the board probe, which starts NativeLegacyDisplay on the
  # darwinboot framebuffer once IOSurface is up (phase 4, as a /arm-io display-subsystem child) with cpu presentation,
  # and the mobile graphics family is loaded for its clients. a kernel without the display archive only reaches the stub
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-client=1",
  "offline-mobile-graphics-load=1",
  "sheng-vsync=60",
  "ml-timeout-lock-panic-scale=40",
  # the CDC-ACM kernel log (drivers/QcomXnuUsbDebug, CONFIG_XNU_QCOM_USB_DEBUG): printf, IOLog, kprintf and the panic drain
  # are teed onto a USB serial port, 1209:316d "QcomXnuUsbDebug". uefi-pdx203's Pdx203UsbDxe leaves the controller clocked
  # with the HS PHY up. qcom-usb-ctl=1 adds the control channel (status, reboot). a refused takeover prints
  # "pdx203 persist[..]: QCOM USB REFUSED error=.." on the console instead.
  "qcom-usb-debug=1",
  "qcom-usb-ctl=1",
  # sheng's launchd policy (package/BootWatchdogPolicy.c, called from load_init_program by the fork's
  # zzzzzzzzza-launch-policy.patch): disabled.plist on the fresh Data volume before launchd reads it. measured 2026-11-01
  # with the EXITLOG patch (logs/usb-04): watchdogd and liveactivitiesd crash-looped on SIGTRAP (16 each in ~5 min),
  # bluetoothd and fairplayd.A2 respawned 69 times each. sheng-lite is sheng's list of jobs with nothing to do on a board
  # with no radios or accounts (bluetoothd, fairplayd.A2, locationd, CommCenter, ...); the three named jobs are alioth's
  # (same soc and os), where liveactivitiesd traps in CalendarUIKit
  "sheng-disable-watchdogd=1",
  "sheng-lite=1",
  "sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined",
  # touch. offline-hid-input=1 has the late probe load IOHIDFamily and IOHIDEventDriver and start NativeHidInput on
  # IOHIDResource (package/HidInputProbe.cpp, alioth's); sheng-touch-hid=1 gives that device the ten-finger digitizer and
  # registers its sink; pdx203-touch=1 starts the sec_ts probe (package/Pdx203TouchProbe.cpp: GENI I2C 0x48 on SE13 as
  # ios-sweet drives it on this phone), which publishes contacts through the native_touch_* seqlock. its log lines start
  # "PDX203 TOUCH" on the usb log
  "offline-hid-input=1",
  "sheng-touch-hid=1",
  "pdx203-touch=1",
  # the AppleKeyStore stand-in (package/KeyStoreProbe.cpp + drivers/NativeKeyStoreEvents, alioth's pair). without a SEP and
  # its keybag the lock screen asks for a passcode nothing can satisfy (2026-11-01, touch boot); this owned AppleKeyStore
  # answers "no passcode, nothing locked". alioth: add sheng-aks-sls=3 only if the prompt survives
  "offline-key-events=1",
  "sheng-aks=1",
  # RAM asked for as Device memory is mapped Normal non-cacheable (the fork's zzzzzzzzzc-pmap-ram-wc.patch): backboardd's
  # software renderer clears display surfaces with bzero, whose DC ZVA alignment-faults on Device memory (SIGBUS in
  # CA::OGL::SWContext::set_surface after Get Started, 2026-11-01). real MMIO is not affected
  "pmap-ram-wc=1",
  # cpu clocks: vote every epss frequency domain its highest non-turbo level (package/CpuFreqProbe.cpp, alioth's, same sm8250
  # windows at 0x18591000/2000/3000). the usb log carries "PDX203 CPUFREQ" rows with each domain's level before and after the
  # vote. sheng-cpufreq=1 only reads; sheng-cpufreq-cap=<MHz> caps the vote
  "sheng-cpufreq=3",
  # persistent Data: NativeRamBlock keeps the Data seed's changed pages in a store window at the end of userdata (NativeUfs
  # store, the only path that writes; clear of the root image and a 1 GiB reserve), so iPadOS keeps Setup, settings and its
  # first-boot work across boots. 2 reads and writes, 1 only reads the store. a seed over 2 GiB (local/owner-data-64g.dbr, built
  # with seed-data-grow.py --gib 64) is served from the store instead of RAM. a different seed size starts Data over
  "sheng-data-persist=2",
]
# Fixups of signed text, applied by the kernel after signature validation and only where the original bytes match
# (patches/xnu/native-text-fixup.patch). They reach it as /chosen/text-fixups, not on the command line. Each is
# <file name>,<file offset>,<original>,<replacement>, in hex. sheng's list for the same 21H461 build; the original bytes
# were checked against this tree's 044-76034-038 (SystemOS cryptex) and 044-76040-038 (OS) images.
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] only forces +[AWClientPreferences initialize] and deadlocks SpringBoard
  # startup against it (ABBA between the main thread and Siri's SASMyriadController), so the boot stays on the Apple logo
  # (2026-11-01 here). It returns at once instead.
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  # PosterBoardServices: PRSPosterPathURLResourceValues and PRSPosterPathFileAttributes require NSFileProtectionNone, which a
  # Data volume without data protection never reports, so no poster and no wallpaper is ever made. Both dictionaries keep
  # only their first entry.
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  # BTAudioHALPlugin's factory returns NULL, so audiomxd skips it instead of reconnecting to the missing Bluetooth audio
  # service thousands of times a second.
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
  # CoreImage _CIGLIsUsable (0x1975c8df8, .07 + 0x2d00df8) answers false. With no Metal device, -[CIContext initWithOptions:]
  # falls back to an OpenGL ES context because EAGL reports itself usable, and CI::GLContext::init then calls through
  # GetMacroContext's dispatch table, which is all zero without a GPU driver: SpringBoard died at pc 0 (glDisable) styling an
  # SF symbol image through +[CUIShapeEffectStack sharedCIContext] after Setup, 15 times (2026-11-01, logs/usb-11/usb-12).
  # Answering false sends initWithOptions: down its own "no renderer" path, which returns nil instead.
  "dyld_shared_cache_arm64.07,2d00df8,fd7bbfa9fd030091,00008052c0035fd6",
]

[payload.adt]
# Data keeps its writes (sheng-data-persist=2): no /chosen/ephemeral-storage, so datamigrator and keybagd treat it as real storage
persistent_data = true
tool = "scripts/make-pdx203-adt.py"
chip_id = "207"
# 3 GiB window. it needs the uefi-pdx203 Pdx203BootMemoryDxe that adds the upper bank (no 1 GiB / below-4 GiB cap
# any more): with the old firmware only 0xc0000000+0x2de00000 existed and the 512 MiB window that fit there ran the
# ipados userland out of pages (free=0x29b of 0x1b733, 2026-11-01). darwinboot takes the first run that fits in
# address order, so a window bigger than every low-bank run lands in the upper bank (0x1_00000000 + 0xfcc00000, where
# ios-sweet ran xnu on this phone) and leaves ~950 MiB of it to the firmware's own top-down allocations
owned_memory_size = "0xc0000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the OS volume of the 21H461 ipad7,1 image, as on sheng
# mount(8) phase 1 names /private/preboot/<hash> from /chosen/boot-manifest-hash, launchd's mount[3] exited with
# status 66 without it (2026-11-01, uke saw the same). there is no apple personalization manifest here, so this is an
# explicit bring-up boot-set identity in uke's form: SHA-384 of "Pdx203Bringup.BootSet.v1\0", not apple data
boot_manifest_hash = "1d0d00ef77a4c50547b2d7fbfd56aeeb40c17eda7e79c8ca5154b8c334ec3699b0dfaae2fd1cae411831855ab1451d6b"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"   # mpidr aff1 numbering, verified by ios-sweet with cpus=8
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"        # the platform seed is not stored in any repository
